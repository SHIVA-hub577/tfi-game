<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151f"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#ffb703" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Film strip accents -->
  <path d="M 60 120 L 452 120" stroke="#ffb703" stroke-width="4" stroke-dasharray="16 12" stroke-opacity="0.4"/>
  <path d="M 60 392 L 452 392" stroke="#ffb703" stroke-width="4" stroke-dasharray="16 12" stroke-opacity="0.4"/>

  <!-- Cinema Clapperboard Backing -->
  <rect x="100" y="140" width="312" height="232" rx="20" fill="#181c2b" stroke="#ffffff" stroke-width="3" stroke-opacity="0.15"/>

  <!-- Clapper top stick with diagonal stripes -->
  <g transform="rotate(-8 100 140)">
    <rect x="90" y="110" width="330" height="42" rx="8" fill="#12151f" stroke="#ffb703" stroke-width="3"/>
    <polygon points="120,110 145,110 115,152 90,152" fill="#ffb703"/>
    <polygon points="180,110 205,110 175,152 150,152" fill="#ffb703"/>
    <polygon points="240,110 265,110 235,152 210,152" fill="#ffb703"/>
    <polygon points="300,110 325,110 295,152 270,152" fill="#ffb703"/>
    <polygon points="360,110 385,110 355,152 330,152" fill="#ffb703"/>
  </g>

  <!-- Golden Auction Gavel crossed in center -->
  <g transform="translate(256 260) rotate(28)" filter="url(#goldGlow)">
    <!-- Handle -->
    <rect x="-10" y="-30" width="20" height="150" rx="10" fill="url(#goldGrad)" stroke="#000" stroke-width="3"/>
    <!-- Head -->
    <rect x="-55" y="-60" width="110" height="44" rx="12" fill="url(#goldGrad)" stroke="#000" stroke-width="3"/>
    <!-- Sound block -->
    <rect x="-70" y="125" width="140" height="24" rx="8" fill="url(#crimsonGrad)" stroke="#ffb703" stroke-width="2"/>
  </g>

  <!-- Big Glowing Coin Badge -->
  <circle cx="160" cy="310" r="44" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" filter="url(#goldGlow)"/>
  <text x="160" y="324" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#0b0d13" text-anchor="middle">🪙</text>

  <!-- TFI Text Ribbon -->
  <text x="256" y="445" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="46" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">TFI AUCTION</text>
</svg>
